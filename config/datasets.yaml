# Dataset registry for ovarian aging biomarker research.
#
# Add one entry per dataset. Keep raw data out of git and store local paths under data/raw,
# data/external, data/interim, or data/processed as appropriate.

datasets:
  - id: example_dataset
    name: Example dataset placeholder
    status: planned
    owner: TBD
    source_url: null
    access_notes: "Replace with access requirements, consent constraints, and data-use terms."
