[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predicteve"
version = "0.1.0"
description = "Python-first ovarian aging biomarker discovery toolkit."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Michal Sharabi-Schwager" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "typer>=0.12",
]

[project.optional-dependencies]
omics = [
    "anndata>=0.10",
    "scanpy>=1.10",
]
dev = [
    "black>=24.0",
    "ipykernel>=6.29",
    "jupyterlab>=4.1",
    "mypy>=1.9",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
predicteve-baseline = "predicteve.models:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
