[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovarian-aging-biomarkers"
version = "0.1.0"
description = "Python-first ovarian aging biomarker discovery toolkit."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Michal Sharabi-Schwager" }]
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "scipy",
  "scikit-learn",
  "statsmodels",
  "matplotlib",
  "seaborn",
  "plotly",
  "pyyaml",
  "typer",
]

[project.optional-dependencies]
omics = ["anndata", "scanpy"]
dev = ["black", "ipykernel", "jupyterlab", "pytest", "ruff", "mypy"]

[project.scripts]
ovarian-aging-baseline = "ovarian_aging_biomarkers.models:main"
predicteve-baseline = "ovarian_aging_biomarkers.models:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
